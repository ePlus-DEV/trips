name: Fix i18n flight link markers

on:
  push:
    branches:
      - agent/navigation-i18n
    paths:
      - '.github/workflows/fix-i18n-link-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/navigation-i18n
          fetch-depth: 0
      - run: python3 scripts/fix-i18n-link-markers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent duplicate flight navigation links"
          git push origin HEAD:agent/navigation-i18n
