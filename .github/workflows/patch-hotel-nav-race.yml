name: Apply hotel nav and workflow race fix

on:
  push:
    branches:
      - fix/hotel-nav-and-workflow-race
    paths:
      - '.github/workflows/patch-hotel-nav-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hotel-nav-and-workflow-race
          fetch-depth: 0

      - name: Patch navigation and shared concurrency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Dashboard: sidebar, header action, hero action and mobile nav.
          replace_once(
              'index.html',
              '      <a href="./flights/"><span class="nav-icon"><svg><use href="#i-plane"/></svg></span>Giá vé</a>\n      <a href="#budget">',
              '      <a href="./flights/"><span class="nav-icon"><svg><use href="#i-plane"/></svg></span>Giá vé</a>\n      <a href="./hotels/"><span class="nav-icon"><svg><use href="#i-pin"/></svg></span>Giá phòng</a>\n      <a href="#budget">'
          )
          replace_once(
              'index.html',
              '        <a class="btn sm" href="./flights/">Xem giá vé</a>',
              '        <a class="btn sm" href="./hotels/">Giá phòng</a>\n        <a class="btn sm" href="./flights/">Xem giá vé</a>'
          )
          replace_once(
              'index.html',
              '<div class="hero-actions"><a class="btn" href="#itinerary">Xem lịch trình</a><a class="btn secondary" href="./flights/">Theo dõi giá vé</a></div>',
              '<div class="hero-actions"><a class="btn" href="#itinerary">Xem lịch trình</a><a class="btn secondary" href="./flights/">Theo dõi giá vé</a><a class="btn secondary" href="./hotels/">Theo dõi giá phòng</a></div>'
          )
          replace_once(
              'index.html',
              '  <a href="#checklist"><span class="nav-icon"><svg><use href="#i-check"/></svg></span>Chuẩn bị</a>\n</nav>',
              '  <a href="./hotels/"><span class="nav-icon"><svg><use href="#i-pin"/></svg></span>Giá phòng</a>\n</nav>'
          )

          # Flight tracker: expose Hotel Prices alongside Flight Prices.
          replace_once(
              'flights.html',
              '      <a class="active" href="./flights.html"><span class="nav-icon"><svg><use href="#i-plane"/></svg></span>Giá vé</a>\n      <a href="./index.html#budget">',
              '      <a class="active" href="./flights.html"><span class="nav-icon"><svg><use href="#i-plane"/></svg></span>Giá vé</a>\n      <a href="./hotels.html"><span class="nav-icon"><svg><use href="#i-pin"/></svg></span>Giá phòng</a>\n      <a href="./index.html#budget">'
          )
          replace_once(
              'flights.html',
              '<header class="topbar"><div class="crumb"><strong>Giá vé</strong><span>Hành trình Trung Quốc 2026</span></div><div class="top-actions"><a class="btn sm" href="./index.html">Về tổng quan</a>',
              '<header class="topbar"><div class="crumb"><strong>Giá vé</strong><span>Hành trình Trung Quốc 2026</span></div><div class="top-actions"><a class="btn sm" href="./hotels.html">Giá phòng</a><a class="btn sm" href="./index.html">Về tổng quan</a>'
          )
          replace_once(
              'flights.html',
              '<a href="./index.html#checklist"><svg><use href="#i-check"/></svg>Chuẩn bị</a></nav>',
              '<a href="./hotels.html"><svg><use href="#i-pin"/></svg>Giá phòng</a></nav>'
          )

          # Flight and hotel snapshot writers must serialize against each other.
          replace_once(
              '.github/workflows/update-flight-prices.yml',
              '  group: live-flight-prices-${{ github.ref }}',
              '  group: price-tracker-writes-${{ github.ref }}'
          )
          replace_once(
              '.github/workflows/update-hotel-prices.yml',
              '  group: live-hotel-prices-${{ github.ref }}',
              '  group: price-tracker-writes-${{ github.ref }}'
          )
          PY

          rm .github/workflows/patch-hotel-nav-race.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html flights.html .github/workflows/update-flight-prices.yml .github/workflows/update-hotel-prices.yml .github/workflows/patch-hotel-nav-race.yml
          git commit -m "fix: link hotel tracker and serialize price writers"
          git push origin HEAD:fix/hotel-nav-and-workflow-race
