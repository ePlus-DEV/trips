name: Update live flight prices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-flights.mjs'
      - 'scripts/enrich-booking-options.mjs'
      - 'scripts/update-api-usage.mjs'
      - '.github/workflows/update-flight-prices.yml'
  schedule:
    # 07:17 in Vietnam (UTC+7).
    - cron: '17 0 * * *'

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: price-tracker-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check SerpApi configuration
        id: config
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
          SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
          SERPAPI_BOOKING_API_KEY: ${{ secrets.SERPAPI_BOOKING_API_KEY }}
          BOOKING_OPTIONS_ENABLED: ${{ vars.BOOKING_OPTIONS_ENABLED }}
        shell: bash
        run: |
          if [ -z "$SERPAPI_API_KEY" ] && [ -z "$SERPAPI_API_KEY_2" ] && [ -z "$SERPAPI_API_KEY_3" ] && [ -z "$SERPAPI_BOOKING_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "booking_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SerpApi credential is configured."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

          if [ -z "$SERPAPI_API_KEY" ] && [ -z "$SERPAPI_API_KEY_2" ] && [ -z "$SERPAPI_API_KEY_3" ]; then
            echo "::warning::No dedicated flight-search credential is configured. The Booking Options credential will be used as the search fallback if available."
          fi

          booking_flag=$(printf '%s' "${BOOKING_OPTIONS_ENABLED:-}" | tr '[:upper:]' '[:lower:]')
          case "$booking_flag" in
            1|true|yes|on)
              if [ -n "$SERPAPI_BOOKING_API_KEY" ]; then
                echo "booking_enabled=true" >> "$GITHUB_OUTPUT"
                echo "Booking Options enrichment is enabled."
              else
                echo "booking_enabled=false" >> "$GITHUB_OUTPUT"
                echo "::warning::BOOKING_OPTIONS_ENABLED is enabled, but SERPAPI_BOOKING_API_KEY is missing. Booking Options enrichment will be skipped."
              fi
              ;;
            *)
              echo "booking_enabled=false" >> "$GITHUB_OUTPUT"
              echo "Booking Options enrichment is disabled. Set repository variable BOOKING_OPTIONS_ENABLED=true to enable it."
              ;;
          esac

      - name: Fetch Google Flights prices via SerpApi
        id: search
        if: steps.config.outputs.enabled == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
          SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
          SERPAPI_BOOKING_API_KEY: ${{ secrets.SERPAPI_BOOKING_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          keys=("$SERPAPI_API_KEY" "$SERPAPI_API_KEY_2" "$SERPAPI_API_KEY_3")
          attempted=0
          last_status=1
          search_ok=0

          for index in "${!keys[@]}"; do
            key="${keys[$index]}"
            [ -z "$key" ] && continue

            attempted=$((attempted + 1))
            slot=$((index + 1))
            echo "Trying dedicated SerpApi flight-search credential #${slot}..."

            set +e
            output=$(SERPAPI_API_KEY="$key" node scripts/fetch-flights.mjs 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              search_ok=1
              echo "booking_fallback_used=false" >> "$GITHUB_OUTPUT"
              echo "search_credential=search_${slot}" >> "$GITHUB_OUTPUT"
              echo "Dedicated search credential #${slot} completed successfully."
              break
            fi

            last_status=$status
            if printf '%s' "$output" | grep -Eqi '(^|[^0-9])429([^0-9]|$)|quota|rate[ -]?limit|monthly[[:space:]]+search|search(es)?[[:space:]]+limit|credit(s)?[[:space:]]+(exhausted|limit)'; then
              echo "::warning::Dedicated search credential #${slot} has no usable quota/rate capacity. Trying the next configured search credential."
            else
              echo "::warning::Dedicated search credential #${slot} failed. Trying the next configured search credential."
            fi
          done

          if [ "$search_ok" -ne 1 ] && [ -n "$SERPAPI_BOOKING_API_KEY" ]; then
            echo "All dedicated search credentials are unavailable. Trying SERPAPI_BOOKING_API_KEY as the last-resort Google Flights search credential..."

            set +e
            output=$(SERPAPI_API_KEY="$SERPAPI_BOOKING_API_KEY" node scripts/fetch-flights.mjs 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"
            last_status=$status

            if [ "$status" -eq 0 ]; then
              search_ok=1
              echo "booking_fallback_used=true" >> "$GITHUB_OUTPUT"
              echo "search_credential=booking_fallback" >> "$GITHUB_OUTPUT"
              echo "Booking credential completed the Google Flights search fallback successfully."
            else
              echo "::error::Booking credential fallback also failed."
            fi
          fi

          if [ "$search_ok" -ne 1 ]; then
            if [ "$attempted" -eq 0 ] && [ -z "$SERPAPI_BOOKING_API_KEY" ]; then
              echo "::error::No usable SerpApi credential was available."
              exit 2
            fi
            echo "::error::No SerpApi credential could complete the live flight search."
            exit "$last_status"
          fi

          if [ ! -f data/flights.json ]; then
            echo "::error::Flight search did not produce data/flights.json."
            exit 3
          fi

      - name: Enrich Booking Options and baggage
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.booking_enabled == 'true' && steps.search.outputs.booking_fallback_used != 'true'
        env:
          SERPAPI_BOOKING_API_KEY: ${{ secrets.SERPAPI_BOOKING_API_KEY }}
          BOOKING_OPTIONS_LIMIT_PER_ROUTE: ${{ vars.BOOKING_OPTIONS_LIMIT_PER_ROUTE }}
        run: node scripts/enrich-booking-options.mjs

      - name: Explain skipped Booking Options after search fallback
        if: steps.search.outputs.booking_fallback_used == 'true'
        run: echo "Booking Options enrichment was skipped because SERPAPI_BOOKING_API_KEY was already used for the live flight search fallback."

      - name: Evaluate price alert
        if: steps.config.outputs.enabled == 'true' && github.ref_name == 'main' && steps.search.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_AMOUNT: ${{ vars.FLIGHT_ALERT_AMOUNT }}
          ALERT_CURRENCY: ${{ vars.FLIGHT_ALERT_CURRENCY }}
        shell: bash
        run: |
          if [ -z "$ALERT_AMOUNT" ]; then
            echo "No FLIGHT_ALERT_AMOUNT repository variable configured; skipping GitHub Issue alert."
            exit 0
          fi

          CURRENT_AMOUNT=$(node -p "require('./data/flights.json').cheapest?.offer?.total_amount || ''")
          CURRENT_CURRENCY=$(node -p "require('./data/flights.json').cheapest?.offer?.total_currency || ''")
          CURRENT_AIRLINE=$(node -p "require('./data/flights.json').cheapest?.offer?.owner?.name || 'Unknown airline'")
          CURRENT_SCENARIO=$(node -p "require('./data/flights.json').cheapest?.label || 'China trip'")
          CHECKED_AT=$(node -p "require('./data/flights.json').generated_at || new Date().toISOString()")
          ALERT_CURRENCY=${ALERT_CURRENCY:-$CURRENT_CURRENCY}

          if [ -z "$CURRENT_AMOUNT" ] || [ -z "$CURRENT_CURRENCY" ]; then
            echo "No cheapest live price found; skipping alert."
            exit 0
          fi

          if [ "$CURRENT_CURRENCY" != "$ALERT_CURRENCY" ]; then
            echo "::warning::Price alert currency is $ALERT_CURRENCY but Google Flights returned $CURRENT_CURRENCY. Alert comparison skipped."
            exit 0
          fi

          TITLE="✈️ Flight price alert · China 2026"
          ISSUE=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "✈️ Flight price alert · China 2026") | .number' | head -n 1)

          if node -e "process.exit(Number(process.argv[1]) <= Number(process.argv[2]) ? 0 : 1)" "$CURRENT_AMOUNT" "$ALERT_AMOUNT"; then
            BODY=$(cat <<EOF
          ## Price target reached 🎯

          Latest Google Flights snapshot via SerpApi is at or below the configured target.

          | | |
          |---|---|
          | **Current total** | ${CURRENT_AMOUNT} ${CURRENT_CURRENCY} |
          | **Target** | ${ALERT_AMOUNT} ${ALERT_CURRENCY} |
          | **Airline** | ${CURRENT_AIRLINE} |
          | **Scenario** | ${CURRENT_SCENARIO} |
          | **Checked** | ${CHECKED_AT} |
          | **Travellers** | 6 adults + 1 infant under 2 on lap |

          Open the live dashboard: https://trips.eplus.dev/flights.html

          > Search prices can change. Verify the itinerary and final booking price before paying.
          EOF
          )

            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --body "$BODY"
              echo "Updated existing price alert issue #$ISSUE."
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "Created a new price alert issue."
            fi
          else
            echo "Current price ${CURRENT_AMOUNT} ${CURRENT_CURRENCY} is above target ${ALERT_AMOUNT} ${ALERT_CURRENCY}."
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "Latest price moved back above the target: ${CURRENT_AMOUNT} ${CURRENT_CURRENCY} (target ${ALERT_AMOUNT} ${ALERT_CURRENCY}). The next target hit can create a fresh alert."
            fi
          fi

      - name: Update SerpApi credit usage snapshot
        if: always() && steps.config.outputs.enabled == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
          SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
          SERPAPI_BOOKING_API_KEY: ${{ secrets.SERPAPI_BOOKING_API_KEY }}
        run: node scripts/update-api-usage.mjs

      - name: Commit refreshed snapshots
        if: always() && steps.config.outputs.enabled == 'true'
        id: commit
        run: |
          if git diff --quiet -- data/flights.json data/flight-history.json data/api-usage.json README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No flight/API usage changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json data/flight-history.json data/api-usage.json README.md
          git commit -m "chore: refresh Google Flights and API usage [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.config.outputs.enabled == 'true' && steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
