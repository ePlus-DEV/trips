<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Shanghai skyline at dusk">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#77a8e8"/><stop offset=".46" stop-color="#4779bd"/><stop offset="1" stop-color="#173961"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173b68"/><stop offset="1" stop-color="#0b2341"/></linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d94c51"/><stop offset="1" stop-color="#7e1f34"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="700" fill="url(#sky)"/>
<circle cx="1320" cy="120" r="170" fill="#ffd68a" opacity=".15" filter="url(#blur)"/>
<g opacity=".23" fill="#d9ecff"><circle cx="225" cy="115" r="3"/><circle cx="480" cy="86" r="2.5"/><circle cx="865" cy="145" r="3"/><circle cx="1100" cy="74" r="2"/></g>
<rect y="535" width="1600" height="165" fill="url(#water)"/>
<g fill="#173253">
  <rect x="0" y="405" width="75" height="130"/><rect x="82" y="360" width="62" height="175"/><rect x="150" y="390" width="90" height="145"/>
  <rect x="255" y="330" width="70" height="205"/><rect x="338" y="388" width="80" height="147"/><rect x="430" y="300" width="78" height="235"/>
  <rect x="1010" y="350" width="72" height="185"/><rect x="1090" y="292" width="95" height="243"/><rect x="1195" y="382" width="78" height="153"/>
  <rect x="1285" y="330" width="85" height="205"/><rect x="1380" y="270" width="95" height="265"/><rect x="1490" y="365" width="110" height="170"/>
</g>
<g fill="#21466f">
  <rect x="545" y="270" width="78" height="265" rx="4"/><rect x="635" y="235" width="92" height="300" rx="4"/>
  <rect x="745" y="315" width="78" height="220"/><rect x="835" y="250" width="70" height="285"/>
</g>
<!-- Shanghai Tower -->
<path d="M930 535 L946 145 Q970 70 988 42 Q1005 112 1009 179 L1018 535 Z" fill="#204f7e"/>
<path d="M956 145 Q984 98 996 65" fill="none" stroke="#9bc6f2" stroke-width="6" opacity=".55"/>
<!-- Oriental Pearl Tower -->
<g transform="translate(480 0)">
  <rect x="34" y="197" width="10" height="338" fill="#c4d8ee"/>
  <path d="M39 95 L39 197" stroke="#d8e9f8" stroke-width="5"/>
  <path d="M39 60 L39 104" stroke="#f1d3d7" stroke-width="3"/>
  <circle cx="39" cy="246" r="48" fill="url(#tower)"/>
  <circle cx="39" cy="246" r="31" fill="#d84854"/>
  <circle cx="39" cy="148" r="23" fill="#c93a4b"/>
  <circle cx="39" cy="370" r="18" fill="#cc4350"/>
  <path d="M8 535 L39 336 L70 535 Z" fill="#b6cce4" opacity=".9"/>
</g>
<!-- windows -->
<g fill="#ffd98b" opacity=".62">
  <path d="M92 385h8v5h-8zm18 0h8v5h-8zm18 0h8v5h-8zm165-25h8v5h-8zm18 0h8v5h-8zm143-30h8v5h-8zm20 0h8v5h-8z"/>
  <path d="M566 320h8v5h-8zm20 0h8v5h-8zm70-45h9v5h-9zm22 0h9v5h-9zm130 70h8v5h-8zm52-55h8v5h-8z"/>
  <path d="M1120 332h8v5h-8zm22 0h8v5h-8zm175 45h8v5h-8zm24 0h8v5h-8zm80-70h9v5h-9zm25 0h9v5h-9z"/>
